<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15161a">
<title>NIKKE 덱 랩</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>NIKKE 덱 랩</h1>
  <div id="status">계산기 로딩 중…</div>
</header>

<nav class="tabs">
  <button class="tab on" data-tab="deck">편성</button>
  <button class="tab" data-tab="log">기록</button>
  <button class="tab" data-tab="growth">육성</button>
</nav>

<main>
  <section class="panel" data-panel="deck">
    <!-- 육성 기준은 **앱 전역**이다 (webapp-roadmap.md §4) — 내 계정 상태는 하나뿐이라
         편성안마다 다를 이유가 없다. 그래서 편성안 드롭다운보다 위에 선다.
         프로필은 PC의 scraper/profile_fetch.py가 만든 파일을 그대로 고른다 — 브라우저가
         직접 받을 길이 없다(§4). 파일은 이 브라우저 밖으로 나가지 않는다 -->
    <div class="bar">
      <div class="field">
        <b>기준</b>
        <div id="growth" class="chips"></div>
        <label id="profile-pick" class="mini">파일 고르기<input id="profile-file" type="file"
               accept=".json,application/json" hidden></label>
        <button id="profile-del" class="mini danger" title="프로필 지우기" hidden>✕</button>
      </div>
      <div id="profile-info" class="ghint"></div>
    </div>

    <!-- 편성안 = 5덱 한 벌 + 그 벌이 상대할 약점. 여러 벌을 두고 바꿔 가며 잰다.
         칩 줄이 아니라 드롭다운인 이유는 벌이 스무 개를 넘어가서다 — 가로 스크롤은
         목록을 숨긴다. 네이티브 select는 폰에서 전체를 한 화면에 띄운다.
         맨 위에 두는 이유는 아래 설정 바가 이 편성안에 딸린 값이기 때문이다 -->
    <div class="plans">
      <span class="pick-wrap">
        <button id="plan-pick" type="button" aria-haspopup="listbox" aria-expanded="false"></button>
        <input id="plan-name" type="text" maxlength="24" placeholder="편성안 이름" hidden>
      </span>
      <button id="plan-add" class="mini" title="편성안 추가">＋</button>
      <button id="plan-rename" class="mini" title="편성안 이름 바꾸기">이름</button>
      <button id="plan-clone" class="mini" title="편성안 복제">복제</button>
      <button id="plan-del" class="mini danger" title="편성안 삭제">✕</button>
      <!-- 직접 만든 목록. 네이티브 select는 옵션에 이미지를 못 받아서, 속성 아이콘을
           쓰려면 이 방법뿐이다 -->
      <div id="plan-list" class="plan-list" role="listbox" hidden></div>
    </div>

    <div class="bar">
      <div class="field">
        <b>약점</b>
        <div id="code" class="chips"></div>
      </div>
      <div class="field">
        <b>코어</b>
        <div id="core" class="chips"></div>
        <label id="core-size" hidden><input id="core-px" type="number" min="1" max="240" step="1"> px</label>
      </div>
    </div>

    <div class="sumline">
      <div id="sum" class="sum"></div>
      <button id="calc-all" class="calc">전부 계산</button>
    </div>
    <div id="dup-warn" class="dup-warn"></div>
    <div id="decks"></div>

    <details id="compare" class="fold">
      <summary>편성안 비교<span id="compare-on"></span></summary>
      <div id="compare-body"></div>
    </details>

    <div class="bench">
      <div class="bench-head">
        <span class="bench-no">후보</span>
        <span id="bench-count"></span>
      </div>
      <p class="bench-hint">검색해서 올려두고 덱으로 끌어 쓴다 · 계산에는 들어가지 않는다</p>
      <div id="bench-slots" class="slots"></div>
    </div>

    <div class="pool-head">
      <input id="q" type="search" placeholder="캐릭터 검색" autocomplete="off">
      <span id="pool-count"></span>
    </div>
    <!-- 필터 행은 roster.json의 facets로 만든다 (분류축 정본은 context/roster.py) -->
    <details id="filter-box" class="fold">
      <summary>필터<span id="filter-on"></span></summary>
      <div id="filters"></div>
    </details>
    <div id="pool"></div>
  </section>

  <section class="panel" data-panel="log" hidden>
    <p class="todo">기록 탭 — 2단계에서 만든다.<br>시즌 · 덱 · 시도를 입력하고 내보낸다.</p>
  </section>

  <!-- 육성 탭은 둘로 나뉜다. `내 육성`은 불러온 프로필을 그대로 읽는 조회 화면이고,
       `투자 효율`은 편성안 한 벌을 가져와 25명의 **다음 한 칸**이 덱 딜을 얼마나
       올리는지 재는 계산 화면이다. 둘 다 프로필 없이는 할 말이 없어 같이 잠긴다. -->
  <section class="panel" data-panel="growth" hidden>
    <div class="gsub">
      <button class="gtab on" data-gtab="mine">내 육성</button>
      <button class="gtab" data-gtab="eff">투자 효율</button>
    </div>
    <p id="g-locked" class="todo" hidden></p>
    <div id="g-mine" class="gview"></div>
    <div id="g-eff" class="gview" hidden></div>
  </section>
</main>

<!-- growth.js는 app.js의 상태·헬퍼를 호출 시점에 쓴다. 최상위에서는 정의만 하므로
     읽는 순서가 앞이어도 되고, app.js의 main()이 initGrowth()로 불러 깨운다. -->
<script src="growth.js"></script>
<script src="app.js"></script>
</body>
</html>
